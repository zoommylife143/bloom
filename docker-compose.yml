# Bloom on one VM: docker compose up -d --build
# Web (both Flutter apps + /api/ proxy) on port 80; API internal only; SQLite on a volume.
# Configuration comes from .env (copy .env.example). .env is optional so the stack still
# starts without keys (dev mode; AI calls then fail with a 502, healthz and pages work).
name: bloom

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: bloom-api:latest
    env_file:
      - path: .env
        required: false
    volumes:
      - bloom-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        API_BASE_URL: /api
    image: bloom-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BLOOM_HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  bloom-data:
