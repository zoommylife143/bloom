# Bloom: one origin serves both web apps and the API.
#   /          -> 302 /intake/
#   /intake/   patient app (P screens), SPA fallback to its index.html
#   /doctor/   clinic app (D and S screens), SPA fallback to its index.html
#   /api/      reverse proxy to the FastAPI container (api:8000)
# Same origin for web and API, so the browser sends no CORS preflight.

# Path-only access log: $uri has no query string ($request and $request_uri do).
log_format bloom_noquery '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

upstream bloom_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log bloom_noquery;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json font/ttf font/otf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = / {
        return 302 /intake/;
    }

    location = /intake { return 301 /intake/; }
    location = /doctor { return 301 /doctor/; }

    # index.html (and the SPA fallback that serves it) must never be cached,
    # so a redeploy is picked up on the next load.
    location = /intake/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /doctor/index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location /intake/ {
        try_files $uri $uri/ /intake/index.html;
    }

    location /doctor/ {
        try_files $uri $uri/ /doctor/index.html;
    }

    location /api/ {
        proxy_pass http://bloom_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model calls (TrustedRouter, Context.dev) can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
}
