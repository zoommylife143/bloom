# Bloom: one origin serves both web apps and the API.
#   /          landing page (deploy/landing/index.html): Patient and Doctor buttons
#   /intake/   patient app (P screens), SPA fallback to its index.html
#   /doctor/   clinic app (D and S screens), SPA fallback to its index.html
#   /api/      reverse proxy to the FastAPI container (api:8000)
# Same origin for web and API, so the browser sends no CORS preflight.
#
# Runs in nginxinc/nginx-unprivileged (uid 101), so it listens on 8080 inside the
# container; docker-compose.yml publishes it as ${BLOOM_HTTP_PORT:-80} on the host
# (IPv4 and IPv6). Redirects are relative (absolute_redirect off), so nothing here
# depends on the public hostname, port or scheme (Cloudflare quick tunnel, Boat IPv6).
#
# Cache policy (apps are built with --web-content-hash; public caching applies to 2xx/3xx only):
#   index.html, flutter_bootstrap.js, flutter.js, *.json, service worker -> no-cache
#   main.dart.<hash>.js and other content-hashed files                  -> 1 year, immutable
#   canvaskit/ (bundled locally, NOT hashed)                              -> 1 day, revalidate
#   everything else (icons, favicon, unhashed assets)                     -> 1 hour
# Header snippets live in /etc/nginx/snippets (deploy/nginx-*.conf). add_header in a
# location replaces the server-level set, so every location includes the security set.

# Path-only access log: $uri has no query string ($request and $request_uri do).
log_format bloom_noquery '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

# Flutter wasm builds emit .mjs; nginx's mime.types lacks it.
types {
    text/javascript mjs;
}

# Docker's embedded DNS. Re-resolve "api" so a recreated api container (new IP)
# does not leave nginx proxying to a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream bloom_api {
    zone bloom_api 64k;
    server api:8000 resolve;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    access_log /var/log/nginx/access.log bloom_noquery;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # The API takes JSON only; 5 MB leaves room for long intake transcripts.
    client_max_body_size 5m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/wasm image/svg+xml application/manifest+json font/ttf font/otf
               application/octet-stream;

    include /etc/nginx/snippets/bloom-security-headers.conf;

    # Landing page: one link for judges, with a Patient and a Doctor button (deploy/landing/).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/bloom-security-headers.conf;
    }
    location ~ ^/(bloom-logo\.svg|zoom-my-life-logo\.png)$ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/bloom-security-headers.conf;
    }

    # Pitch deck: static page with its images and demo clip (deploy/landing/pitch/).
    location = /pitch { return 301 /pitch/; }
    location ^~ /pitch/ {
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/bloom-security-headers.conf;
    }

    location = /intake { return 301 /intake/; }
    location = /doctor { return 301 /doctor/; }

    location ~ ^/(intake|doctor)/ {
        try_files $uri $uri/ /$1/index.html;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/bloom-security-headers.conf;

        # Entry points and manifests: always revalidate, so a redeploy shows on next load.
        # (index.html is also what the SPA fallback above serves for deep links.)
        location ~ ^/(intake|doctor)/(index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|[^/]+\.json)$ {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/bloom-security-headers.conf;
        }

        # CanvasKit/skwasm bundled with --no-web-resources-cdn: not content-hashed.
        location ~ ^/(intake|doctor)/canvaskit/ {
            add_header Cache-Control "public, max-age=86400";
            include /etc/nginx/snippets/bloom-security-headers.conf;
        }

        # Content-hashed files (main.dart.<hash>.js, assets/...<hash>...): cache forever.
        location ~ "^/(intake|doctor)/.*\.[0-9a-f]{8,}\.[A-Za-z0-9]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/snippets/bloom-security-headers.conf;
        }
    }

    location /api/ {
        proxy_pass http://bloom_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model calls (TrustedRouter, Context.dev) can take 60 s or more.
        # (A Cloudflare quick tunnel cuts requests at ~100 s regardless.)
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bloom-security-headers.conf;
    }

    # D05 scenario replay runs up to 12 model turns in one request.
    location /api/demo/ {
        proxy_pass http://bloom_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/bloom-security-headers.conf;
    }

    # Anything else (e.g. /favicon.ico probes): plain 404.
    location / {
        return 404;
    }
}
