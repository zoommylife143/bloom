# Security headers for every Bloom response. Included in each location that sets
# its own add_header (nginx does not inherit add_header into such locations).
# No Content-Security-Policy on purpose: Flutter Web needs inline bootstrap config,
# wasm compilation and blob: workers, and a wrong CSP silently breaks the demo.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
